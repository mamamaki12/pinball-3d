<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover,user-scalable=no">
<meta name="theme-color" content="#101014">
<meta name="description" content="ブラウザーで遊べる3Dピンボール。4つの台からえらべます。">
<style>
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);box-sizing:border-box}
body{margin:0;font-size:14px}
[hidden]{display:none!important}
</style>
</head>
<body>
<title>3Dピンボール</title>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Orbitron:wght@900&family=Mochiy+Pop+One&family=DotGothic16&family=Dela+Gothic+One&family=Zen+Kaku+Gothic+New:wght@500;700&display=swap">
<style>
/* 台の写真を4枚ならべるだけの入口。色と文字は各台のものをそのまま使う */
:root { color-scheme: dark; --page: #101014; --ink: #f2f0ea; --dim: #a3a1ab; --rule: #2a2a33; }
html, body { background: var(--page); color: var(--ink); font-family: 'Zen Kaku Gothic New','Hiragino Sans','Yu Gothic',sans-serif; }
main { max-width: 1080px; margin: 0 auto; padding-block: 28px 48px; padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px)); }
h1 { font-family: 'Dela Gothic One', sans-serif; font-weight: 400; font-size: clamp(30px, 8vw, 54px); line-height: 1.1; margin: 0 0 8px; }
.lead { margin: 0 0 24px; color: var(--dim); font-size: 15px; line-height: 1.8; max-width: 34em; }
.grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(230px, 1fr)); gap: 16px; }
.card { position: relative; display: block; aspect-ratio: 4 / 5; max-width: 100%; overflow: hidden; border-radius: 14px; background: var(--bg); color: #fff; text-decoration: none; border: 1px solid var(--rule); }
.card img { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; transition: transform .35s ease; }
.card:hover img { transform: scale(1.04); }
.card:focus-visible { outline: 3px solid var(--a2); outline-offset: 3px; }
.txt { position: absolute; inset: auto 0 0 0; display: grid; gap: 4px; padding: 44px 14px 14px; background: linear-gradient(transparent, var(--bg) 62%); }
.txt strong { font-family: var(--f); font-weight: 400; font-size: 19px; line-height: 1.25; color: var(--a2); }
.txt span { font-size: 12.5px; line-height: 1.6; color: #fff; opacity: .85; }
.how { margin: 28px 0 0; padding: 0; list-style: none; display: grid; gap: 6px; color: var(--dim); font-size: 13.5px; line-height: 1.8; }
.how b { color: var(--ink); font-weight: 700; margin-right: .8em; }
@media (prefers-reduced-motion: reduce) { .card img { transition: none; } }
</style>
<main>
  <h1>3Dピンボール</h1>
  <p class="lead">台を1つえらんで遊びます。ボールは3球。スマホなら、傾けると台をのぞきこむように視点が動きます。</p>
  <div class="grid">
  <a class="card" href="neon.html" style="--bg:#07051a;--a1:#ff3fa4;--a2:#3ff0ff;--f:'Orbitron','Zen Kaku Gothic New',sans-serif">
    <img src="thumbs/neon.jpg" alt="" width="480" height="600" loading="lazy">
    <span class="txt"><strong>ネオン街ピンボール</strong><span>雨あがりの夜の街。いちばん基本の台</span></span>
  </a>
  <a class="card" href="umi.html" style="--bg:#02202e;--a1:#ffb347;--a2:#7dffd9;--f:'Mochiy Pop One',sans-serif">
    <img src="thumbs/umi.jpg" alt="" width="480" height="600" loading="lazy">
    <span class="txt"><strong>うみのそこピンボール</strong><span>クジラの泳ぐ海。水車がボールをはじく</span></span>
  </a>
  <a class="card" href="hoshi.html" style="--bg:#050510;--a1:#ffd23f;--a2:#b28dff;--f:'DotGothic16',monospace">
    <img src="thumbs/hoshi.jpg" alt="" width="480" height="600" loading="lazy">
    <span class="txt"><strong>ほしぞらワープピンボール</strong><span>星図の上でワープ。ボールが3つに増える</span></span>
  </a>
  <a class="card" href="retro.html" style="--bg:#24150f;--a1:#f0a01e;--a2:#f6d77a;--f:'Dela Gothic One',sans-serif">
    <img src="thumbs/retro.jpg" alt="" width="480" height="600" loading="lazy">
    <span class="txt"><strong>レトロ横丁ピンボール</strong><span>昭和の商店街。ベルが鳴るなつかしの一台</span></span>
  </a>
  </div>
  <ul class="how">
    <li><b>フリッパー</b>画面の左半分・右半分をタッチ（キーボードは ← →）</li>
    <li><b>発射</b>画面の右側を長押ししてはなす（スペースキー）</li>
    <li><b>台ゆらし</b>スマホを振る（↑キー）。やりすぎるとティルトでフリッパーが止まります</li>
  </ul>
</main>
</body>
</html>
